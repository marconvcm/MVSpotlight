name: Build Packages & GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (for manual triggers)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-fedora-rpm:
    name: Build Fedora RPM Package (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y git cmake gcc-c++ rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile MVSpotlight
        run: cmake --build build -j$(nproc)

      - name: Run automated test suite
        run: ctest --test-dir build --output-on-failure

      - name: Generate RPM package
        run: cpack --config build/CPackConfig.cmake -G RPM

      - name: Upload Fedora RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvspotlight-fedora-rpm
          path: build/*.rpm
          if-no-files-found: error

  build-debian-deb:
    name: Build Debian/Ubuntu DEB Package (.deb) & Tarball
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install Debian/Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential dpkg-dev \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev libgl1-mesa-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile MVSpotlight
        run: cmake --build build -j$(nproc)

      - name: Run automated test suite
        run: ctest --test-dir build --output-on-failure

      - name: Generate DEB & TGZ packages
        run: cpack --config build/CPackConfig.cmake -G "DEB;TGZ"

      - name: Upload Debian DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvspotlight-debian-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Upload Linux Portable Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvspotlight-linux-tarball
          path: build/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-fedora-rpm, build-debian-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download Fedora RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: mvspotlight-fedora-rpm
          path: release-assets/

      - name: Download Debian DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: mvspotlight-debian-deb
          path: release-assets/

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v4
        with:
          name: mvspotlight-linux-tarball
          path: release-assets/

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum *.rpm *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.rpm
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
