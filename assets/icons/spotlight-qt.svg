<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyan Deep Space Drop Shadow -->
    <filter id="g2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00F5FF" flood-opacity="0.25"/>
    </filter>

    <!-- Cyan Glow Filter -->
    <filter id="g2-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Void Space Background -->
    <linearGradient id="g2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A36"/>
      <stop offset="45%" stop-color="#050E21"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>

    <!-- Radar Sweep Fan Gradient -->
    <linearGradient id="g2-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#081A36" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan Pulsar Rim Gradient -->
    <linearGradient id="g2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Pulsar Cavity Radial Gradient -->
    <radialGradient id="g2-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#1E1B4B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Handle Gradient -->
    <linearGradient id="g2-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#g2-bg)" filter="url(#g2-shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="26.5" fill="none" stroke="rgba(0, 245, 255, 0.35)" stroke-width="1.2"/>

  <!-- Radar Scanning Sector Angle behind the lens -->
  <path d="M 53 50 L 14 18 A 52 52 0 0 1 88 16 Z" fill="url(#g2-sweep)" opacity="0.45"/>

  <!-- Cosmic Stardust Grid Nodes -->
  <g fill="#00F5FF">
    <circle cx="20" cy="24" r="1" opacity="0.8"/>
    <circle cx="98" cy="20" r="1.2" opacity="0.7"/>
    <circle cx="104" cy="80" r="0.9" opacity="0.7"/>
    <circle cx="26" cy="92" r="1" opacity="0.6"/>
    <circle cx="90" cy="96" r="0.8" opacity="0.5"/>
    <circle cx="16" cy="60" r="0.8" opacity="0.5"/>
  </g>

  <!-- HUD Coordinates Lines & Reticle -->
  <g opacity="0.35" stroke="#00F5FF" stroke-width="0.8">
    <circle cx="53" cy="50" r="42" fill="none" stroke-dasharray="2,6"/>
    <circle cx="53" cy="50" r="34" fill="none" stroke-dasharray="4,4"/>
    <!-- Cardinal Crosshair Ticks -->
    <line x1="53" y1="12" x2="53" y2="18"/>
    <line x1="53" y1="82" x2="53" y2="88"/>
    <line x1="15" y1="50" x2="21" y2="50"/>
    <line x1="85" y1="50" x2="91" y2="50"/>
  </g>

  <!-- Magnifier Assembly -->
  <g>
    <!-- Handle Shadow -->
    <line x1="72" y1="72" x2="98" y2="98" stroke="#000000" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

    <!-- Handle Body -->
    <line x1="71" y1="71" x2="97" y2="97" stroke="url(#g2-handle)" stroke-width="9.5" stroke-linecap="round"/>

    <!-- Electric Cyan Telemetry Line -->
    <line x1="75" y1="75" x2="93" y2="93" stroke="#00F5FF" stroke-width="2.2" stroke-linecap="round" filter="url(#g2-glow)"/>
    <circle cx="97" cy="97" r="3.2" fill="#00F5FF" filter="url(#g2-glow)"/>

    <!-- Lens Outer Glowing Bezel -->
    <circle cx="53" cy="50" r="26.5" fill="none" stroke="url(#g2-rim)" stroke-width="5.5"/>

    <!-- Lens Interior Void Cavity -->
    <circle cx="53" cy="50" r="23" fill="#030816"/>
    <circle cx="53" cy="50" r="23" fill="url(#g2-core-glow)"/>

    <!-- Pulsar Target Grid inside Lens -->
    <g stroke="#00F5FF" stroke-width="1" opacity="0.65">
      <circle cx="53" cy="50" r="16" fill="none" stroke-dasharray="3,3"/>
      <circle cx="53" cy="50" r="9" fill="none"/>
      <line x1="53" y1="36" x2="53" y2="64"/>
      <line x1="39" y1="50" x2="67" y2="50"/>
    </g>

    <!-- Detected Cosmic Beacon Blips -->
    <circle cx="61" cy="42" r="1.8" fill="#38BDF8" filter="url(#g2-glow)"/>
    <circle cx="45" cy="58" r="1.4" fill="#A855F7" filter="url(#g2-glow)"/>

    <!-- Quantum Pulsar Star Core -->
    <g filter="url(#g2-glow)">
      <!-- Radiating Shockwave Ring -->
      <circle cx="53" cy="50" r="5" fill="none" stroke="#00F5FF" stroke-width="1.5"/>
      <circle cx="53" cy="50" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Specular Crescent Glint -->
    <path d="M 37 41 A 18 18 0 0 1 65 35" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
